name: Deploy approved readability changes once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-readability-once.yml'
jobs:
  package:
    if: vars.MARKET_PAGES_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Package public reader without running the publisher
        run: |
          mkdir -p "$RUNNER_TEMP/market-pages/data"
          cp index.html "$RUNNER_TEMP/market-pages/"
          cp -R assets reports "$RUNNER_TEMP/market-pages/"
          cp data/public-market.json "$RUNNER_TEMP/market-pages/data/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/market-pages
  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: pages
