name: Verify Market Daily PR
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: pip install -r requirements-public.txt
      - name: Synthetic regression and publication isolation tests
        run: python -m unittest discover -s tests -p 'test_*.py'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Reject conflict markers
        run: git diff --check HEAD~1 HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser for isolated UI checks
        run: |
          npm install --prefix "$RUNNER_TEMP/market-browser" playwright@1.62.1
          "$RUNNER_TEMP/market-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Five-width public, synthetic quote and readability regression
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: ${{ runner.temp }}/market-browser/node_modules
        run: |
          node tests/public-reader.cjs
          node tests/market-ui.cjs
          node tests/readability-ui.cjs
