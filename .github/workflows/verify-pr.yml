name: Verify Market Daily PR
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: pip install -r requirements-public.txt
      - name: Synthetic regression and publication isolation tests
        run: python -m unittest discover -s tests -p 'test_*.py'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Reject conflict markers
        run: git diff --check HEAD~1 HEAD
