name: Publish Market Daily at 17 KST (Yahoo + Naver)
on:
  schedule:
    - cron: '0 8 * * 1-5'
    - cron: '15 8 * * 1-5'
    - cron: '30 8 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: market-daily-close-publish
  cancel-in-progress: false
jobs:
  close-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-market.txt
      - name: Check if today's report is already published
        id: publication
        shell: bash
        run: |
          TODAY="$(TZ=Asia/Seoul date +%F)"
          echo "date=$TODAY" >> "$GITHUB_OUTPUT"
          if [ -f "content/daily/$TODAY.json" ] && [ -f "reports/daily/$TODAY.html" ]; then
            python - "$TODAY" <<'PY'
          import json,sys
          from pathlib import Path
          day=sys.argv[1]
          doc=json.loads(Path(f"content/daily/{day}.json").read_text())
          if doc.get("publish") and doc.get("verification")=="verified":
              with open(__import__("os").environ["GITHUB_OUTPUT"],"a") as out: out.write("already_published=true\\n")
          PY
          fi
      - name: Verify Python syntax before fetching data
        if: steps.publication.outputs.already_published != 'true'
        run: python -m py_compile scripts/collect_close.py scripts/build_reports.py
      - name: Install data readers
        if: steps.publication.outputs.already_published != 'true'
        run: pip install -r requirements-market.txt
      - name: Cross-check same-day Yahoo and Naver closes
        if: steps.publication.outputs.already_published != 'true'
        run: python scripts/collect_close.py
        env:
          TZ: Asia/Seoul
      - name: Generate standardized Ivory and Sage daily HTML and archive
        if: steps.publication.outputs.already_published != 'true'
        run: python scripts/build_reports.py
      - name: Commit only verified generated materials
        if: steps.publication.outputs.already_published != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/daily data/market-snapshot.json reports/daily/ reports/index.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified market close $(TZ=Asia/Seoul date +%F)"
            git pull --rebase
            git push
          fi
      - name: Open or update publication failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          DATE="$(TZ=Asia/Seoul date +%F)"
          TITLE="Market Daily 자동 발행 실패: $DATE"
          BODY="자동 발행 워크플로 실패. 실행 로그: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n데이터 제공처·교차 검증·HTML 생성·GitHub 권한을 확인하세요. 기존 발행 리포트는 유지됩니다."
          EXISTING="$(gh issue list --state open --search "$TITLE in:title" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
