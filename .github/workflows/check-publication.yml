name: Check public daily study at 18:50 KST
on:
  schedule:
    - cron: '50 9 * * 1-5'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-public.txt
      - run: python -m scripts.check_publication
