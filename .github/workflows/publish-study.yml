name: Public Daily Study at 18 KST
on:
  schedule:
    - cron: '7 8 * * 1-5' # 17:07 KST first attempt
    - cron: '0 9 * * 1-5'
    - cron: '15 9 * * 1-5'
    - cron: '30 9 * * 1-5'
    - cron: '47 9 * * 1-5' # 18:47 KST backup; SECTION 02 cutoff stays 18:30
    - cron: '40 22 * * 1-5' # Tuesday-Saturday 07:40 KST, prior-session recovery
  workflow_dispatch:
    inputs:
      news_date:
        description: 'Optional YYYY-MM-DD for a news-only revision of a published report'
        type: string
permissions:
  contents: write
concurrency:
  group: market-daily-public
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install calendar and source adapters
        run: pip install -r requirements-public.txt
      - name: Check public template and data permissions
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Publish from latest main with bounded fast-forward retry
        env:
          MARKET_NEWS_SCHEDULE: ${{ github.event.schedule }}
          MARKET_NEWS_DATE: ${{ inputs.news_date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$MARKET_NEWS_DATE" ]; then
            python scripts/publish_public_study.py --news-date "$MARKET_NEWS_DATE"
          elif [ "$MARKET_NEWS_SCHEDULE" = "40 22 * * 1-5" ]; then
            python scripts/publish_public_study.py --region kr --recover
          else
            python scripts/publish_public_study.py --region kr
          fi
  deploy:
    if: vars.MARKET_PAGES_DEPLOY == 'true'
    needs: publish
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-study-pages.yml
