name: One-time PR 2 Pages deployment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-pr2-once.yml']
permissions:
  contents: read
concurrency:
  group: market-daily-public
  cancel-in-progress: false
jobs:
  deploy-and-check:
    if: vars.MARKET_PAGES_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Record exact deployed source
        run: git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validation dependencies
        run: |
          pip install -r requirements-public.txt
          npm install --prefix "$RUNNER_TEMP/market-browser" --no-audit --no-fund playwright
          "$RUNNER_TEMP/market-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Unit and public-only browser regressions
        run: |
          export CODEX_PRIMARY_RUNTIME_NODE_MODULES="$RUNNER_TEMP/market-browser/node_modules"
          python -m unittest discover -s tests -p 'test_*.py'
          node tests/market-ui.cjs
          node tests/public-reader.cjs
      - name: Stage existing public files without generating any report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('config/market-sources.json').read_text())
          assert all(p.get('enabled') is False for p in cfg['providers'].values())
          data=json.loads(Path('data/public-market.json').read_text())
          assert data.get('indices',[]) == []
          entries=json.loads(Path('reports/index.json').read_text())
          assert len({r['date'] for r in entries}) == len(entries) >= 12
          assert all((Path('reports')/r['url']).is_file() for r in entries)
          print('Public providers disabled; no private records; archive preserved:',len(entries))
          PY
          mkdir -p "$RUNNER_TEMP/market-pages/data"
          cp index.html "$RUNNER_TEMP/market-pages/"
          cp -R assets reports "$RUNNER_TEMP/market-pages/"
          cp data/public-market.json "$RUNNER_TEMP/market-pages/data/"
          git diff --exit-code
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/market-pages
      - name: Deploy using existing official Pages environment
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check actual public site with mobile and desktop browsers
        run: |
          export CODEX_PRIMARY_RUNTIME_NODE_MODULES="$RUNNER_TEMP/market-browser/node_modules"
          node <<'JS'
          const {chromium}=require(process.env.CODEX_PRIMARY_RUNTIME_NODE_MODULES+'/playwright');
          const fs=require('fs'),assert=require('assert/strict');
          const base='https://raygareth.github.io/market-reports/';
          const expected=JSON.parse(fs.readFileSync('reports/index.json','utf8'));
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let browser;
          (async()=>{
            let ready=false;
            for(let n=0;n<24;n++){
              try{
                const response=await fetch(base+'assets/market.js?verify='+Date.now(),{cache:'no-store'});
                if(response.ok&&(await response.text()).includes('fitMarketNumbers')){ready=true;break;}
              }catch{}
              await sleep(10000);
            }
            assert(ready,'New deployed JavaScript did not become available');
            const indexResponse=await fetch(base+'reports/index.json?verify='+Date.now(),{cache:'no-store'});
            assert.equal(indexResponse.status,200);
            const live=await indexResponse.json();
            assert(expected.every(e=>live.some(r=>r.date===e.date&&r.url===e.url)),'Archive entries changed or disappeared');
            const snapshot=await (await fetch(base+'data/public-market.json?verify='+Date.now(),{cache:'no-store'})).json();
            assert.deepEqual(snapshot.indices,[]);
            for(const entry of live)assert.equal((await fetch(base+'reports/'+entry.url)).status,200);
            browser=await chromium.launch({headless:true});
            const results=[];
            for(const width of [320,360,390,768,1280]){
              const context=await browser.newContext({viewport:{width,height:900}});
              const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(e.name));
              await page.goto(base+'?verify='+Date.now(),{waitUntil:'networkidle'});
              await page.waitForFunction(()=>document.querySelectorAll('#market-metrics strong').length===4);
              assert.deepEqual(await page.locator('#market-metrics strong').allTextContents(),Array(4).fill('자료 확인 대기'));
              assert.equal(await page.locator('#usage-notice').count(),1);
              assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth));
              assert.equal(await page.locator('#market-metrics').evaluate(n=>getComputedStyle(n).gridTemplateColumns.split(' ').length),width<=880?2:4);
              const disclosure=page.locator('#market-source-notes summary');
              assert((await disclosure.boundingBox()).height>=32);
              await disclosure.click();assert(await page.locator('#market-source-notes').evaluate(n=>n.open));
              const latest=live.filter(r=>r.status==='published').sort((a,b)=>b.date.localeCompare(a.date))[0];
              await page.waitForFunction(url=>document.querySelector('.quick-access-action').getAttribute('href')==='reports/'+url,latest.url);
              assert((await page.locator('.quick-access-action').boundingBox()).height>=44);
              await page.locator('.quick-access-action').click();
              assert(page.url().endsWith(latest.url));assert.equal(await page.locator('.report-article>section').count(),4);
              assert.equal(await page.locator('#usage-notice').count(),1);
              const form=page.locator('#market-quiz');await form.locator('input').first().check();await form.locator('button[type=submit]').click();assert(await page.locator('#quiz-feedback').isVisible());
              assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth));
              await page.getByRole('link',{name:'← 아카이브로 돌아가기'}).click();await page.locator('.report-row').first().waitFor();assert.equal(await page.locator('.report-row').count(),live.length);
              await page.locator('#search').fill(live[0].date);assert.equal(await page.locator('.report-row').count(),1);
              assert.deepEqual(errors,[]);results.push({width,dashboard:true,cards:true,sourceDisclosure:true,touchTargets:true,latest:true,archive:true,sections:4,quiz:true,noOverflow:true});
              await context.close();
            }
            console.log(JSON.stringify({deployedSite:base,liveArchiveDates:live.length,publicDataEnabled:false,viewports:results}));
          })().catch(e=>{console.error(e);process.exitCode=1}).finally(async()=>{if(browser)await browser.close()});
          JS
