name: Verify U.S. source response and finish PR 4 Pages deployment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-market-close-once.yml'
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-public.txt
      - name: Check U.S. provider status without market values or response bodies
        env:
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import contextlib, io, json, logging
          from pathlib import Path
          import requests
          import check_market_connection as check
          logging.disable(logging.CRITICAL)
          check.INSTRUMENTS = {key: row for key, row in check.INSTRUMENTS.items() if row['region'] == 'us'}
          request = requests.get
          fred_status = []
          def probe(url, *args, **kwargs):
              if not url.startswith('https://fred.stlouisfed.org/'):
                  return request(url, *args, **kwargs)
              try:
                  response = request(url, *args, **kwargs)
              except requests.RequestException as error:
                  fred_status.append(type(error).__name__)
                  raise
              fred_status.append(response.status_code)
              return response
          requests.get = probe
          cfg = json.loads(Path('config/market-sources.json').read_text())
          with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
              result = check.diagnose(cfg)
          print(json.dumps({'fredStatus': fred_status, **result}))
          PY
      - name: Refresh U.S. closes using the existing publisher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/publish_public_study.py --region us
  deploy:
    if: vars.MARKET_PAGES_DEPLOY == 'true'
    needs: refresh
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-study-pages.yml
